<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#b5651d" />
<title>You're offline | Ajanta Prakashan</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem;
    background: radial-gradient(60% 50% at 100% 0%, rgba(181,101,29,.18), transparent 60%), #fcfaf6;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; color: #14171c;
  }
  .card {
    width: 100%; max-width: 26rem; text-align: center; padding: 2.5rem 2rem; background: #fff;
    border: 1px solid rgba(199,204,210,.7); border-radius: 1.5rem; box-shadow: 0 10px 30px -8px rgba(74,42,18,.18);
  }
  img { width: 4rem; height: 4rem; border-radius: 1rem; }
  h1 { margin: 1.25rem 0 .5rem; font-family: Georgia, Cambria, 'Times New Roman', serif; font-size: 1.6rem; line-height: 1.2; }
  p { margin: 0; color: #4a5563; line-height: 1.6; font-size: .95rem; }
  button {
    margin-top: 1.75rem; padding: .8rem 1.75rem; border: 0; border-radius: .75rem; background: #b5651d; color: #fff;
    font: inherit; font-weight: 600; cursor: pointer; transition: background .2s;
  }
  button:hover { background: #954f17; }
</style>
</head>
<body>
  <main class="card">
    <img src="/images/icon-192.png" alt="" width="64" height="64" />
    <h1>You are offline</h1>
    <p>Some information may be unavailable. Please reconnect to the internet to view the latest conferences, events and notifications.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
